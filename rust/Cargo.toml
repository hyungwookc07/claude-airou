[package]
name = "claude-airou"
version = "0.1.0"
edition = "2021"
description = "Cross-platform rewrite of the claude-airou desktop pet (macOS first). Shares all on-disk formats with the Swift app."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Overlay UI (macOS first; the same crates carry the future Windows/Linux ports).
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
tray-icon = "0.19"
ab_glyph = "0.2.32"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSApplication", "NSResponder", "NSRunningApplication", "NSView", "NSColor", "NSColorSpace", "NSAppearance", "NSScreen", "NSAlert", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSArray"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "objc2"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGColorSpace", "CGDataProvider"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
